name: vestment
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/vestment.yml'
      - 'vestment.js'
      - 'package.json'

jobs:
  build_ubuntu2204_node_object:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node vestment.js "socks5://dcswarup:webshare@45.150.23.239:6709" || true

  test_ubuntulatest_bun_possession:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run vestment.js "socks5://dcswarup:webshare@45.39.5.247:6685" || true

  review_windowslatest_node_contrail:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node vestment.js "socks5://dcswarup:webshare@64.137.80.153:5180"

  audit_windows2022_node_thongs:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node vestment.js "socks5://dcswarup:webshare@216.74.80.116:6688"

  audit_windowslatest_node_forager:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node vestment.js "socks5://dcswarup:webshare@45.38.78.78:6015"
