name: vestment
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/vestment.yml'
      - 'vestment.js'
      - 'package.json'

jobs:
  review_windowslatest_node_godparent:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node vestment.js "socks5://dcswarup:webshare@142.111.124.249:6269"

  deploy_windows2025_node_vein:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
