name: ivory-bridge-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ivory-bridge-dispatcher.yml'
      - 'ivory-bridge-dispatcher.js'
      - 'package.json'

jobs:
  compile_ubuntulatest_node_labourer:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@192.210.132.100:6070" || true

  analyze_windowslatest_bun_taxicab:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@216.74.80.116:6688"

