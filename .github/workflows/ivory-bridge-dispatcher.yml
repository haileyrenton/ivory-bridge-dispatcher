        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Execute Verification Suite
          shell: pwsh
          run: |
            npm install
            Write-Output "Starting verification suite..."
            dir
            Start-Sleep -Seconds 475
            Write-Output "Completed successfully!"
