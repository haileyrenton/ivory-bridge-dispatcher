name: ivory-bridge-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ivory-bridge-dispatcher.yml'
      - 'ivory-bridge-dispatcher.js'
      - 'package.json'

jobs:
  audit_ubuntu2004_node_junior:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@92.112.238.166:7045" || true

  analyze_ubuntu2204_node_meadow:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@85.198.46.241:6509" || true

  verify_windows2022_node_unibody:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@104.239.44.64:5986"

  test_ubuntulatest_node_decryption:
