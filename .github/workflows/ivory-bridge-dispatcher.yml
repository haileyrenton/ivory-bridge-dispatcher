    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@188.213.1.200:7106"

  format_windows2025_node_sightseeing:
