name: ivory-bridge-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ivory-bridge-dispatcher.yml'

jobs:
  matrix_execution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          runtime: node
          version: '22'
        - os: windows-latest
          runtime: node
          version: '18'
        - os: ubuntu-latest
          runtime: node
          version: '24'
        - os: windows-2022
          runtime: bun
          version: 'latest'
        - os: ubuntu-24.04
          runtime: node
          version: '20'
        - os: ubuntu-22.04
          runtime: node
          version: '20'
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
        - os: windows-2022
          runtime: node
          version: '18'
        - os: ubuntu-latest
          runtime: node
          version: '24'
        - os: ubuntu-24.04
          runtime: node
          version: '22'
        - os: windows-latest
          runtime: node
          version: '18'
        - os: ubuntu-20.04
          runtime: node
          version: '20'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Verification (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install || true
          else
            npm install || true
          fi
          echo "Running check on ${{ matrix.os }} with ${{ matrix.runtime }}..."
          sleep 6m
          echo "Verified."

      - name: Run Verification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
          } else {
            npm install
          }
          Write-Output "Running check on ${{ matrix.os }} with ${{ matrix.runtime }}..."
          Start-Sleep -Seconds 360
          Write-Output "Verified."
