name: ivory-bridge-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ivory-bridge-dispatcher.yml'

jobs:
  lint_ubuntulatest_node_blight:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Execute Verification Suite
          run: |
            npm install
            echo "Starting verification suite..."
            df
            sleep 5m
            echo "Completed successfully!"

  deploy_ubuntu2404_bun_cleaner:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Execute Verification Suite
          run: |
            bun install
            echo "Starting verification suite..."
            df
            sleep 6m
            echo "Completed successfully!"

  build_windows2025_node_thongs:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Execute Verification Suite
          shell: pwsh
          run: |
            npm install
            Write-Output "Starting verification suite..."
            dir
            Start-Sleep -Seconds 592
            Write-Output "Completed successfully!"

