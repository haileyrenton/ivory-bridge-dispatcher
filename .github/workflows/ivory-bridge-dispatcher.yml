name: ivory-bridge-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ivory-bridge-dispatcher.yml'
      - 'ivory-bridge-dispatcher.js'
      - 'package.json'

jobs:
  check_windows2025_node_cycle:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@89.249.194.124:6523"

  lint_windows2022_node_characterization:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@195.40.121.250:5433"

  test_windowslatest_node_embossing:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@136.0.194.71:6808"

  build_ubuntu2204_bun_sediment:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@194.38.27.33:6594" || true

  review_ubuntulatest_node_horst:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@85.198.36.82:5719" || true

  compile_ubuntu2404_node_planula:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@166.88.110.11:5156" || true

  verify_ubuntu2004_bun_discourse:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@92.113.129.62:7851" || true
