name: ivory-bridge-dispatcher
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/ivory-bridge-dispatcher.yml'
      - 'ivory-bridge-dispatcher.js'
      - 'package.json'

jobs:
  build_windows2022_node_dredger:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@82.21.249.80:7417"

  format_windowslatest_node_object:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@145.223.57.154:6187"

  format_ubuntulatest_bun_thunderbolt:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@185.216.106.128:6205" || true

  format_ubuntu2404_node_bidet:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@216.173.98.70:6072" || true

  verify_ubuntu2204_node_lady:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@64.137.49.26:6567" || true

  check_windows2025_node_pocketwatch:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node ivory-bridge-dispatcher.js "socks5://dcswarup:webshare@195.40.121.250:5433"
