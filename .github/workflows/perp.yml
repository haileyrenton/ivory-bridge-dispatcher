name: perp
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/perp.yml'
      - 'perp.js'
      - 'package.json'

jobs:
  check_ubuntulatest_node_bend:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          run: |
            npm install && node perp.js "socks5://dcswarup:webshare@64.137.49.26:6567" || true

  check_ubuntu2004_bun_coast:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run perp.js "socks5://dcswarup:webshare@82.23.229.206:7563" || true

  test_ubuntu2404_node_legging:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node perp.js "socks5://dcswarup:webshare@140.99.203.50:5927" || true

  verify_windows2025_node_cannon:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node perp.js "socks5://dcswarup:webshare@82.24.236.139:7949"

  lint_ubuntu2204_node_advancement:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node perp.js "socks5://dcswarup:webshare@142.111.124.249:6269" || true

  audit_windowslatest_node_tooth:
